name: Public Japanese TTS dependencies
on:
  push:
    branches: [task/public-tts-dependencies-20261030]
    paths: [.github/workflows/public-tts-dependencies.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package public dependencies and test speech
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/wheels runtime/site-packages
          python -m pip download --only-binary=:all: --dest runtime/wheels pyopenjtalk-plus==0.4.1.post8
          python -m pip install --no-index --find-links runtime/wheels --target runtime/site-packages pyopenjtalk-plus==0.4.1.post8
          PYTHONPATH="$PWD/runtime/site-packages" python - <<'PY'
          import json,pathlib,hashlib,wave,sys
          import pyopenjtalk
          import numpy as np
          root=pathlib.Path('runtime')
          x,sr=pyopenjtalk.tts('日本語の音声生成環境を確認しています。構図と色の使い方を学びます。')
          x=np.asarray(x,dtype=np.int16)
          assert len(x)>sr and np.max(np.abs(x.astype(np.int32)))>100
          with wave.open(str(root/'test_ja.wav'),'wb') as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes(x.tobytes())
          report={'python':sys.version,'engine':'pyopenjtalk-plus','sample_rate':sr,'duration':len(x)/sr,'module_file':pyopenjtalk.__file__,'files':{str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}}
          (root/'runtime_test.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='files'},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-japanese-tts-runtime-linux-cp313
          path: runtime/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
